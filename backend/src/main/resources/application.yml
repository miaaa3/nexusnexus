server:
  port: 8080
  compression:
    enabled: true

spring:
  devtools:
    restart:
      enabled: true
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB

nexus:
  simulation:
    vehicle-count: 2000      # initial vehicle count
    update-rate-ms: 100       # update interval (10 fps server-side, client interpolates)
    max-vehicles: 20000       # hard cap for performance — 15K+ comfortably
    area:
      lat-min: 46.12
      lat-max: 46.22
      lon-min: -1.22
      lon-max: -1.10          # La Rochelle bounding box
    graph-source: local-file  # local-file | overpass
    # OSM file parsed at startup when graph-source = local-file.
    # Absolute path, or relative to the backend working directory.
    # To use your own map, drop a .osm file in backend/data/maps/ and point here,
    # or import one at runtime via the dashboard's Map Import panel.
    local-file: data/maps/la-rochelle.osm
    # Optional local GeoJSON file for IRIS zones (preferred over IGN WFS).
    # Drop a file at this path to enable IRIS analytics offline.
    iris-local-file: data/iris/iris.geojson

logging:
  level:
    com.nexus: DEBUG
